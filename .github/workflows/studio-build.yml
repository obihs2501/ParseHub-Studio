name: Build ParseHub Studio

on:
  workflow_dispatch:
  push:
    branches: [master, main, "feat/**", "fix/**"]
    paths: ["studio/**", "studio-compose/**", "src/**", "test/**", "pyproject.toml", ".github/workflows/studio-build.yml"]
  pull_request:
    paths: ["studio/**", "studio-compose/**", "src/**", "test/**", "pyproject.toml", ".github/workflows/studio-build.yml"]

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline API and sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: node --check src/parsehub_studio/web/app.js
      - run: node tests/frontend_test.cjs
      - run: uv run python tests/smoke_test.py
      - run: uv run python -m unittest discover -s tests -p "test_*.py" -v
      - run: uv run python -m unittest discover -s ../test -p "test_*.py" -v
      - run: uv run python tests/sidecar_check.py

  windows:
    name: Windows x64 installer and portable
    # 仅 master/main 构建原 Tauri 版本；特性分支只编译 Compose
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          uv sync --locked --group build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci
      - name: Test Windows compatibility before packaging
        run: |
          uv run python -m unittest discover -s ../test -p "test_*.py" -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/frontend_test.cjs
      - name: Build Python sidecar
        run: |
          uv run python packaging/make_icon.py
          uv run pyinstaller --noconfirm --clean packaging/parsehub_studio.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python packaging/check_bundle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath dist/parsehub-sidecar.exe -Destination src-tauri/binaries/parsehub-sidecar-x86_64-pc-windows-msvc.exe
      - name: Test frozen sidecar (no Python imports from source)
        run: uv run python tests/sidecar_check.py --executable dist/parsehub-sidecar.exe
      - name: Build Tauri NSIS installer
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc -- --locked
      - name: Prepare portable app
        run: |
          New-Item -ItemType Directory -Force dist/ParseHubStudio-portable/resources | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/parsehub-studio.exe dist/ParseHubStudio-portable/ParseHubStudio.exe
          Copy-Item dist/parsehub-sidecar.exe dist/ParseHubStudio-portable/
          Copy-Item src-tauri/resources/THIRD_PARTY.md dist/ParseHubStudio-portable/resources/
          Copy-Item ../LICENSE dist/ParseHubStudio-portable/
          Copy-Item README.md dist/ParseHubStudio-portable/
      - name: Smoke test real desktop WebView and bundled sidecar
        run: |
          $env:PARSEHUB_DESKTOP_SMOKE_TEST = '1'
          $process = Start-Process -FilePath (Resolve-Path dist/ParseHubStudio-portable/ParseHubStudio.exe) -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Desktop startup timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - name: Collect release files and checksums
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release/
          Compress-Archive -Path dist/ParseHubStudio-portable -DestinationPath release/ParseHubStudio-windows-x64-portable.zip
          $checksums = Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          }
          $checksums | Out-File -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ParseHubStudio-windows-x64
          path: studio/release/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lockfile
          path: studio/src-tauri/Cargo.lock
      - name: Collect build diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force dist/diagnostics | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'io.github.obihs2501.parsehubstudio/sidecar.log'
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination dist/diagnostics/ }
          Get-ChildItem build -Recurse -Filter 'warn-*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination dist/diagnostics/
          }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: studio/dist/diagnostics/

  compose:
    name: Windows x64 Compose (miuix) installer and portable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio-compose
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Python sidecar (reused by Compose app)
        working-directory: studio
        run: |
          uv sync --locked --group build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python packaging/make_icon.py
          uv run pyinstaller --noconfirm --clean packaging/parsehub_studio.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python packaging/check_bundle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage sidecar for packaging
        run: |
          New-Item -ItemType Directory -Force resources/common | Out-Null
          Copy-Item -LiteralPath ../studio/dist/parsehub-sidecar.exe -Destination resources/common/parsehub-sidecar.exe
      - name: Build Compose app (compile check)
        env:
          PARSEHUB_BUILD_DIR: C:\b
        run: |
          New-Item -ItemType Directory -Force C:\b | Out-Null
          .\gradlew.bat --no-daemon compileKotlin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package MSI and EXE installers
        env:
          # WiX light.exe 在长路径下会返回 311；把 build 输出与临时目录都指到短路径
          PARSEHUB_BUILD_DIR: C:\b
          TEMP: C:\t
          TMP: C:\t
        run: |
          New-Item -ItemType Directory -Force C:\t | Out-Null
          New-Item -ItemType Directory -Force C:\b | Out-Null
          .\gradlew.bat --no-daemon packageMsi packageExe
          if ($LASTEXITCODE) {
            Write-Host '::group::jpackage logs'
            Get-ChildItem -Recurse -Path C:\b\compose\logs -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "----- $($_.FullName) -----"
              Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
            }
            Write-Host '::endgroup::'
            Write-Host 'Retrying packaging once after clearing WiX cache...'
            Remove-Item -Recurse -Force C:\b\wix311 -ErrorAction SilentlyContinue
            .\gradlew.bat --no-daemon packageMsi packageExe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Assemble portable app
        run: |
          New-Item -ItemType Directory -Force dist/ParseHubStudioCompose-portable | Out-Null
          Copy-Item -Recurse -Force C:\b\compose\binaries\main\app\ParseHubStudio\* dist/ParseHubStudioCompose-portable/
          Copy-Item -Force ../LICENSE dist/ParseHubStudioCompose-portable/
          # sidecar 已随 appResourcesRootDir 打进 app/resources/
          Get-ChildItem -Recurse -Path dist/ParseHubStudioCompose-portable -Filter parsehub-sidecar.exe |
            Select-Object -First 1 | ForEach-Object { Write-Host "Bundled sidecar: $($_.FullName)" }
      - name: Collect Compose release files and checksums
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Get-ChildItem C:\b\compose\binaries\main\msi\*.msi -ErrorAction SilentlyContinue | Copy-Item -Destination release/
          Get-ChildItem C:\b\compose\binaries\main\exe\*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination release/
          Compress-Archive -Path dist/ParseHubStudioCompose-portable -DestinationPath release/ParseHubStudioCompose-windows-x64-portable.zip
          $checksums = Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          }
          $checksums | Out-File -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ParseHubStudioCompose-windows-x64
          path: studio-compose/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Compose build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-build-diagnostics
          path: |
            studio-compose/build/reports/**
            studio-compose/**/build/reports/**

  release:
    name: Publish tested Windows binaries
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: [windows, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ParseHubStudio-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v0.4.1-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ParseHub Studio 0.4.1 · Build ${{ github.run_number }}
          prerelease: true
          body: |
            Windows 10/11 x64 · Tauri 2 + bundled Python sidecar · Lightweight build.

            - Compact centered 1040x680 window (minimum 820x560); Cookie pools and parser bookmarks are full workspace pages.
            - Collapsible platform/author history groups with remembered state, author labels and manual information refresh.
            - Download cards show covers, readable post titles, authors and post IDs instead of filenames or timestamps.
            - Safe same-folder archiving: existing files are never overwritten; only colliding filenames get suffixes.
            - Cross-platform author aliases and the {creator} naming token; existing numbered folders are not moved automatically.
            - Redesigned sidebar workspace with a single scrollable content area, separate downloads/history, and light/dark themes.
            - Mixed-platform batch parsing (50 links, 3 concurrent), per-item results, cancellation and retry.
            - Original-resolution image viewer: zoom, pan, 1:1, fit, rotate and keyboard navigation.
            - Element-based folder/file naming with previews, safe filenames and collision protection.
            - Publication-date naming token, platform-grouped results/history, and persistent current-file download progress.
            - Per-platform Cookie pools with rotation and manual parser-site bookmarks; credentials are never sent to bookmarked sites.
            - Resolution, author and post information; improved Weibo history covers and Windows compatibility tests.
            - Highest available Douyin variant; optional isolated KuKuTool web window with manual link entry (no automatic result import).
            - Fix Douyin original-quality downloads: the app/mobile interface's top-level `play_addr` (the original master) is preferred again instead of transcoded bytevc1/bytevc2 gears, restoring the full-resolution stream.
            - Weibo image CDN failover without lowering download quality; Douyin short-link redirect fix.
            - Reduced false service-disconnection alerts and non-blocking proxy/metadata work.
            - No bundled FFmpeg, OpenCV, NumPy or pydub. Uses your installed FFmpeg/FFprobe via PATH or Settings.

            - Install: download the `setup.exe` file. WebView2 is installed automatically if missing (Internet required).
            - Portable: extract the entire ZIP, then run `ParseHubStudio.exe`. Requires Microsoft Edge WebView2 Runtime.
            - No Python, Node.js or Rust installation needed. No local compilation needed.
            - Unsigned preview build: Windows SmartScreen may show a reputation warning.
            - API, frozen sidecar lifecycle and real Tauri WebView startup are tested before publishing.
          files: release/*
          fail_on_unmatched_files: true
