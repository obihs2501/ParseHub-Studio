name: Build ParseHub Studio

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["studio/**", "src/**", "test/**", "pyproject.toml", ".github/workflows/studio-build.yml"]
  pull_request:
    paths: ["studio/**", "src/**", "test/**", "pyproject.toml", ".github/workflows/studio-build.yml"]

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline API and sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: node --check src/parsehub_studio/web/app.js
      - run: node tests/frontend_test.cjs
      - run: uv run python tests/smoke_test.py
      - run: uv run python -m unittest discover -s tests -p "test_*.py" -v
      - run: uv run python -m unittest discover -s ../test -p "test_core_offline.py" -v
      - run: uv run python tests/sidecar_check.py

  windows:
    name: Windows x64 installer and portable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri -> target
          cache-on-failure: true
      - name: Install locked dependencies
        run: |
          uv sync --locked --group build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci
      - name: Build Python sidecar
        run: |
          uv run python packaging/make_icon.py
          uv run pyinstaller --noconfirm --clean packaging/parsehub_studio.spec
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python packaging/check_bundle.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item -LiteralPath dist/parsehub-sidecar.exe -Destination src-tauri/binaries/parsehub-sidecar-x86_64-pc-windows-msvc.exe
      - name: Test frozen sidecar (no Python imports from source)
        run: uv run python tests/sidecar_check.py --executable dist/parsehub-sidecar.exe
      - name: Build Tauri NSIS installer
        run: npm run desktop:build -- --target x86_64-pc-windows-msvc -- --locked
      - name: Prepare portable app
        run: |
          New-Item -ItemType Directory -Force dist/ParseHubStudio-portable/resources | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/parsehub-studio.exe dist/ParseHubStudio-portable/ParseHubStudio.exe
          Copy-Item dist/parsehub-sidecar.exe dist/ParseHubStudio-portable/
          Copy-Item src-tauri/resources/THIRD_PARTY.md dist/ParseHubStudio-portable/resources/
          Copy-Item ../LICENSE dist/ParseHubStudio-portable/
          Copy-Item README.md dist/ParseHubStudio-portable/
      - name: Smoke test real desktop WebView and bundled sidecar
        run: |
          $env:PARSEHUB_DESKTOP_SMOKE_TEST = '1'
          $process = Start-Process -FilePath (Resolve-Path dist/ParseHubStudio-portable/ParseHubStudio.exe) -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Desktop startup timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - name: Collect release files and checksums
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe release/
          Compress-Archive -Path dist/ParseHubStudio-portable -DestinationPath release/ParseHubStudio-windows-x64-portable.zip
          $checksums = Get-ChildItem -LiteralPath release -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          }
          $checksums | Out-File -Encoding utf8 release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ParseHubStudio-windows-x64
          path: studio/release/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-lockfile
          path: studio/src-tauri/Cargo.lock
      - name: Collect build diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force dist/diagnostics | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'io.github.obihs2501.parsehubstudio/sidecar.log'
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination dist/diagnostics/ }
          Get-ChildItem build -Recurse -Filter 'warn-*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination dist/diagnostics/
          }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: studio/dist/diagnostics/

  release:
    name: Publish tested Windows binaries
    if: github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ParseHubStudio-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v0.3.0-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ParseHub Studio 0.3.0 Workspace · Build ${{ github.run_number }}
          prerelease: true
          body: |
            Windows 10/11 x64 · Tauri 2 + bundled Python sidecar · Lightweight build.

            - Redesigned sidebar workspace with a single scrollable content area, separate downloads/history, and light/dark themes.
            - Mixed-platform batch parsing (50 links, 3 concurrent), per-item results, cancellation and retry.
            - Original-resolution image viewer: zoom, pan, 1:1, fit, rotate and keyboard navigation.
            - Element-based folder/file naming with previews, safe filenames and collision protection.
            - Highest available Douyin variant; optional isolated KuKuTool web window with manual link entry (no automatic result import).
            - Weibo image CDN failover without lowering download quality; Douyin short-link redirect fix.
            - Reduced false service-disconnection alerts and non-blocking proxy/metadata work.
            - No bundled FFmpeg, OpenCV, NumPy or pydub. Uses your installed FFmpeg/FFprobe via PATH or Settings.

            - Install: download the `setup.exe` file. WebView2 is installed automatically if missing (Internet required).
            - Portable: extract the entire ZIP, then run `ParseHubStudio.exe`. Requires Microsoft Edge WebView2 Runtime.
            - No Python, Node.js or Rust installation needed. No local compilation needed.
            - Unsigned preview build: Windows SmartScreen may show a reputation warning.
            - API, frozen sidecar lifecycle and real Tauri WebView startup are tested before publishing.
          files: release/*
          fail_on_unmatched_files: true
