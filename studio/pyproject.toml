[project]
name = "parsehub-studio"
version = "0.3.0"
description = "ParseHub 可视化桌面应用：解析社交平台内容并可视化预览、下载"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "parsehub",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.0",
    "bleach>=6.2.0",
]

[dependency-groups]
build = ["pyinstaller>=6.10"]

[project.scripts]
parsehub-studio = "parsehub_studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsehub_studio"]

[tool.uv.sources]
parsehub = { path = "..", editable = true }

[tool.uv]
package = true

[tool.ruff]
line-length = 120
